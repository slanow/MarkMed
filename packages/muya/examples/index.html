<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="./icon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MarkMed — Demonstração Online</title>
        <meta name="description" content="Experimente o MarkMed diretamente no navegador: editor Markdown visual, offline e portátil para prontuários e notas médicas." />
    </head>
    <body>
        <header class="app-header">
            <div class="header-left">
                <img src="./icon.png" alt="MarkMed" class="header-logo" width="28" height="28" />
                <div class="header-titles">
                    <span class="header-brand">MarkMed</span>
                    <span class="header-tag">Live Demo</span>
                </div>
            </div>

            <div class="header-center">
                <button id="btn-copy-txt" class="btn btn-action" title="Copia o prontuário como texto simples sem Markdown para colar em qualquer sistema hospitalar">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <span>Copiar TXT</span>
                </button>
                <button id="btn-reset" class="btn btn-secondary" title="Restaura o modelo clínico de exemplo">
                    Restaurar Exemplo
                </button>
                <button id="btn-clear" class="btn btn-secondary" title="Limpar editor">
                    Limpar
                </button>
            </div>

            <div class="header-right">
                <a href="https://github.com/slanow/MarkMed/wiki" target="_blank" rel="noopener noreferrer" class="btn btn-link">
                    Wiki &amp; Guia
                </a>
                <a href="https://github.com/slanow/MarkMed/releases" target="_blank" rel="noopener noreferrer" class="btn btn-download">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>Baixar Aplicativo</span>
                </a>
            </div>
        </header>

        <div class="notice-bar">
            <span>💡 <strong>Experimente digitar:</strong> Digite <code># </code> para títulos, <code>- [ ] </code> para checklists, <code>/</code> para o menu rápido ou clique nas caixinhas para marcar pendências. O texto fica salvo no seu navegador!</span>
        </div>

        <main class="editor-container">
            <div id="editor"></div>
        </main>

        <div id="toast" class="toast"></div>

        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
