name: Deploy Live Demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/muya/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup
        with:
          node-version: '22.21.1'

      - name: Build Muya types
        run: pnpm --filter @muyajs/core build:types

      - name: Build Web Demo
        run: pnpm --filter muya-examples build

      - name: Prepare demo directory structure
        run: |
          mkdir -p site/demo
          cp -r packages/muya/examples/dist/* site/demo/
          # Optional landing redirect so visiting root redirects cleanly to /demo/
          cat << 'EOF' > site/index.html
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./demo/">
              <title>MarkMed</title>
            </head>
            <body>
              <p>Redirecionando para a demonstração do MarkMed: <a href="./demo/">Clique aqui</a></p>
            </body>
          </html>
          EOF

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
